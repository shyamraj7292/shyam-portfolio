<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Shyamraj H — 3D World</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Baloo+2:wght@600;700&display=swap" />
  <style>
    :root{
      --green:#34ff8f; --bright:#c6ffdd; --dim:#8fb9a6; --ink:#04120c;
      --panel:rgba(6,20,14,.86); --edge:rgba(52,255,143,.35);
      --link:#5fe0ff; --warn:#ffcf5c;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%;overflow:hidden;background:#0a1a24;
      font-family:"JetBrains Mono",ui-monospace,Menlo,monospace;color:var(--bright);
      -webkit-user-select:none;user-select:none;overscroll-behavior:none;touch-action:none}
    #app{position:fixed;inset:0}
    canvas{display:block}

    /* ---- loading ---- */
    #loader{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;
      align-items:center;justify-content:center;gap:16px;background:#06120e;
      transition:opacity .6s ease}
    #loader.hide{opacity:0;pointer-events:none}
    #loader .logo{font-family:"Baloo 2",sans-serif;font-weight:700;font-size:clamp(28px,6vw,52px);
      color:var(--green);text-shadow:0 0 24px rgba(52,255,143,.5);letter-spacing:.02em}
    #loader .sub{color:var(--dim);font-size:13px}
    #loader .barwrap{width:min(260px,60vw);height:4px;background:#123;border-radius:4px;overflow:hidden}
    #loader .bar{height:100%;width:30%;background:var(--green);box-shadow:0 0 12px var(--green);
      animation:load 1.1s ease-in-out infinite}
    @keyframes load{0%{margin-left:-30%}100%{margin-left:100%}}

    /* ---- HUD ---- */
    .hud{position:fixed;z-index:20;pointer-events:none}
    #titlecard{top:18px;left:18px;max-width:min(360px,72vw);
      background:var(--panel);border:1px solid var(--edge);border-radius:14px;
      padding:14px 16px;backdrop-filter:blur(6px)}
    #titlecard h1{font-family:"Baloo 2",sans-serif;font-size:22px;color:var(--green);
      line-height:1.05;text-shadow:0 0 14px rgba(52,255,143,.4)}
    #titlecard .tag{color:var(--dim);font-size:12.5px;margin-top:4px}
    #titlecard .keys{margin-top:10px;font-size:11.5px;color:var(--bright)}
    #titlecard .keys b{color:var(--green)}

    #links{top:18px;right:18px;display:flex;gap:8px;pointer-events:auto}
    #links a,#links .linkbtn{pointer-events:auto;font-size:12px;text-decoration:none;color:var(--bright);
      background:var(--panel);border:1px solid var(--edge);border-radius:9px;padding:7px 11px;
      backdrop-filter:blur(6px);transition:.15s;font-family:inherit;cursor:pointer;line-height:1}
    #links a:hover,#links .linkbtn:hover{color:var(--ink);background:var(--green);border-color:var(--green)}

    #speedo{bottom:16px;left:18px;font-size:12px;color:var(--dim);
      background:var(--panel);border:1px solid var(--edge);border-radius:9px;padding:6px 10px;
      backdrop-filter:blur(6px);font-variant-numeric:tabular-nums}
    #speedo b{color:var(--green)}

    /* proximity prompt */
    #prompt{bottom:22px;left:50%;transform:translateX(-50%);text-align:center;
      background:var(--panel);border:1px solid var(--edge);border-radius:999px;
      padding:9px 18px;font-size:13px;color:var(--bright);backdrop-filter:blur(6px);
      opacity:0;transition:opacity .2s;white-space:nowrap}
    #prompt.show{opacity:1}
    #prompt b{color:var(--green)}

    /* ---- content panel ---- */
    #panel{position:fixed;z-index:30;top:0;right:0;height:100%;width:min(460px,92vw);
      background:var(--panel);border-left:1px solid var(--edge);backdrop-filter:blur(10px);
      transform:translateX(102%);transition:transform .35s cubic-bezier(.4,0,.2,1);
      display:flex;flex-direction:column;pointer-events:auto}
    #panel.open{transform:translateX(0)}
    #panel .head{display:flex;align-items:center;gap:10px;padding:18px 20px 12px;
      border-bottom:1px solid rgba(52,255,143,.18)}
    #panel .head .eyebrow{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim)}
    #panel .head h2{font-family:"Baloo 2",sans-serif;font-size:24px;color:var(--green);line-height:1;
      text-shadow:0 0 14px rgba(52,255,143,.35)}
    #panel .close{margin-left:auto;pointer-events:auto;cursor:pointer;color:var(--dim);
      background:none;border:1px solid var(--edge);border-radius:8px;width:30px;height:30px;
      font-size:16px;font-family:inherit;transition:.15s}
    #panel .close:hover{color:var(--ink);background:var(--green);border-color:var(--green)}
    #panel .body{padding:16px 20px 28px;overflow-y:auto;font-size:13.5px;line-height:1.6;color:var(--bright)}
    #panel .body::-webkit-scrollbar{width:8px}
    #panel .body::-webkit-scrollbar-thumb{background:#1c5b3f;border-radius:8px}
    #panel .item{border-left:2px solid rgba(52,255,143,.3);padding:2px 0 10px 12px;margin-bottom:14px}
    #panel .item .t{color:var(--bright);font-weight:700}
    #panel .item .s{color:var(--link);font-size:12px;margin:2px 0 6px}
    #panel .item ul{margin:0;padding-left:16px;color:var(--dim)}
    #panel .item ul li{margin:3px 0}
    #panel .kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:13px}
    #panel .kv .k{color:var(--green)}
    #panel a{color:var(--link);text-decoration:none;border-bottom:1px dotted var(--link)}
    #panel a:hover{background:var(--link);color:var(--ink)}
    #panel .foot{padding:10px 20px;border-top:1px solid rgba(52,255,143,.18);font-size:11px;color:var(--dim)}

    /* ---- touch controls (mobile) ---- */
    #touch{position:fixed;z-index:25;inset:auto 0 0 0;bottom:14px;display:none;
      justify-content:space-between;padding:0 18px;pointer-events:none}
    #touch .pad{display:grid;grid-template-columns:repeat(3,52px);grid-template-rows:repeat(2,52px);gap:6px}
    #touch button{pointer-events:auto;-webkit-user-select:none;user-select:none;
      background:var(--panel);border:1px solid var(--edge);border-radius:12px;color:var(--green);
      font-size:20px;font-family:inherit;backdrop-filter:blur(6px)}
    #touch button:active{background:var(--green);color:var(--ink)}
    #touch .up{grid-column:2;grid-row:1}
    #touch .left{grid-column:1;grid-row:2}
    #touch .down{grid-column:2;grid-row:2}
    #touch .right{grid-column:3;grid-row:2}
    .touch #touch{display:flex}
    .touch #titlecard .keys{display:none}
    @media (prefers-reduced-motion:reduce){
      #loader .bar{animation:none;width:60%}
    }
  </style>
